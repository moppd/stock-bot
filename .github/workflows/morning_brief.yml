name: US Futures Morning Brief

on:
  schedule:
      # 23:00 UTC วันอาทิตย์-พฤหัสบดี = 06:00 น. วันจันทร์-ศุกร์ (เวลาไทย)
    - cron: '0 23 * * 0-4'
    
    # 05:00, 11:00, 13:00 UTC วันจันทร์-ศุกร์ = 12:00, 18:00, 20:00 น. วันจันทร์-ศุกร์ (เวลาไทย)
    - cron: '0 5,11,13 * * 1-5'
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Brief Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: 'gpt-4o-mini'
          APP_TIMEZONE: 'Asia/Bangkok'
        run: |
          python main.py